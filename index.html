<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVB Abfahrten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #ffffff;
  --surface:   #f8f9fb;
  --border:    #eaecf0;
  --border2:   #d1d5db;
  --text:      #111827;
  --text2:     #6b7280;
  --text3:     #9ca3af;
  --blue:      #2563eb;
  --blue-bg:   #eff6ff;
  --blue-dim:  #bfdbfe;
  --radius:    14px;
  --radius-sm: 10px;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 580px;
  margin: 0 auto;
  padding: 2rem 1.25rem;
}

.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.75rem;
}
.app-icon {
  width: 36px; height: 36px;
  background: var(--blue);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.app-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

/* Search — full width, no button */
.search-wrap {
  position: relative;
  margin-bottom: 1rem;
}
.search-wrap input[type="text"] {
  width: 100%;
  padding: 13px 16px 13px 44px;
  font-size: 15px;
  font-family: inherit;
  font-weight: 500;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  outline: none;
  color: var(--text);
  transition: border-color .15s, box-shadow .15s, background .15s;
  -webkit-appearance: none;
}
.search-wrap input[type="text"]::placeholder { color: var(--text3); font-weight: 400; }
.search-wrap input[type="text"]:focus {
  border-color: var(--blue);
  background: var(--bg);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.search-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  pointer-events: none;
  display: flex;
}
.search-clear {
  position: absolute;
  right: 12px; top: 50%;
  transform: translateY(-50%);
  background: var(--border2);
  border: none;
  border-radius: 50%;
  width: 20px; height: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--bg);
  font-size: 13px;
  line-height: 1;
  padding: 0;
  font-weight: 700;
}
.search-clear.visible { display: flex; }

/* Suggestions */
.suggestions {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 1.25rem;
  box-shadow: 0 4px 20px rgba(0,0,0,.07);
}
.sug-item {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 6px;
  transition: background .1s;
}
.sug-item:last-child { border-bottom: none; }
.sug-item:hover { background: var(--surface); }
.sug-city { color: var(--text3); font-size: 12.5px; font-weight: 400; }

/* Departure header */
.dep-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1rem;
}
.dep-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.3px;
  line-height: 1.2;
}
.dep-sub {
  font-size: 12.5px;
  color: var(--text3);
  margin-top: 4px;
}
.reload-btn {
  padding: 7px 12px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 500;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  cursor: pointer;
  color: var(--text3);
  flex-shrink: 0;
  margin-left: 12px;
  transition: background .12s, color .12s;
}
.reload-btn:hover { background: var(--surface); color: var(--text); }

/* Filters */
.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}
.fbtn {
  font-size: 12.5px;
  font-family: inherit;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  cursor: pointer;
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text3);
  transition: all .12s;
}
.fbtn:hover { background: var(--surface); color: var(--text2); border-color: var(--border2); }
.fbtn.on { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-dim); }

/* Departure rows */
.dep-list { display: flex; flex-direction: column; gap: 6px; }
.dep-row {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 11px;
  transition: border-color .1s;
}
.dep-row:hover { border-color: var(--border2); }

.badge {
  min-width: 52px;
  height: 28px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 700;
  flex-shrink: 0;
  gap: 3px;
}
.tram  { background: #dbeafe; color: #1e40af; }
.bus   { background: #dcfce7; color: #15803d; }
.sbahn { background: #fef9c3; color: #92400e; }
.ferry { background: #e0f2fe; color: #0c4a6e; }

.dir {
  flex: 1;
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pf {
  font-size: 12px;
  color: var(--text3);
  flex-shrink: 0;
  background: var(--surface);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 500;
}
.tblock { text-align: right; flex-shrink: 0; min-width: 64px; }
.tuntil { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; color: var(--text); }
.tnow   { font-size: 15px; font-weight: 700; color: #16a34a; }
.trow2  { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
.ttime  { font-size: 11.5px; color: var(--text3); font-weight: 400; }
.tok    { font-size: 11.5px; color: #16a34a; font-weight: 500; }
.tlate  { font-size: 11.5px; color: #dc2626; font-weight: 500; }
.tneut  { font-size: 11.5px; color: var(--text3); }
.dep-row.cancelled { opacity: .6; }
.tcancelled { font-size: 13px; font-weight: 700; color: #dc2626; }
.ttime.strike { text-decoration: line-through; color: var(--text3); }

.status {
  text-align: center;
  padding: 3.5rem 1rem;
  font-size: 14px;
  color: var(--text3);
}
.status .icon { font-size: 30px; margin-bottom: .75rem; line-height: 1; }

@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #0f0f11;
    --surface: #18181b;
    --border:  #27272a;
    --border2: #3f3f46;
    --text:    #f4f4f5;
    --text2:   #a1a1aa;
    --text3:   #71717a;
    --blue-bg: rgba(37,99,235,.12);
    --blue-dim:rgba(37,99,235,.35);
  }
  .tram  { background: rgba(30,64,175,.2);  color: #93c5fd; }
  .bus   { background: rgba(21,128,61,.2);  color: #86efac; }
  .sbahn { background: rgba(146,64,14,.2);  color: #fde68a; }
  .ferry { background: rgba(12,74,110,.2);  color: #7dd3fc; }
  .search-clear { background: #52525b; }
}
</style>
</head>
<body>
<div class="container">

  <div class="app-header">
    <div class="app-icon">🚊</div>
    <span class="app-title">DVB Abfahrtsmonitor</span>
  </div>

  <div class="search-wrap">
    <span class="search-icon">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" id="inp" placeholder="Haltestelle suchen…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="search-clear" id="clear-btn" onclick="clearSearch()">×</button>
  </div>

  <div id="sug"></div>
  <div id="filters" class="filters" style="display:none"></div>

  <div id="hdr" class="dep-header" style="display:none">
    <div>
      <div class="dep-title" id="stop-lbl"></div>
      <div class="dep-sub" id="upd-lbl"></div>
    </div>
    <button class="reload-btn" onclick="loadDeps()">↻ Aktualisieren</button>
  </div>

  <div id="list" class="dep-list">
    <div class="status"><div class="icon">🚉</div>Haltestelle eingeben</div>
  </div>

</div>
<script>
var stopId = null, stopName = '', allDeps = [], activeF = 'all', timer = null, debounce = null;
var inp = document.getElementById('inp');
var clearBtn = document.getElementById('clear-btn');

inp.addEventListener('input', function() {
  var q = inp.value.trim();
  clearBtn.classList.toggle('visible', q.length > 0);
  if (!q) { document.getElementById('sug').innerHTML = ''; return; }
  clearTimeout(debounce);
  debounce = setTimeout(function() { fetchSuggestions(q); }, 280);
});

inp.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') clearSearch();
});

function clearSearch() {
  inp.value = '';
  clearBtn.classList.remove('visible');
  document.getElementById('sug').innerHTML = '';
  inp.focus();
}

function setS(h) {
  document.getElementById('list').innerHTML = '<div class="status">' + h + '</div>';
}

function api(path, body) {
  return fetch('/api/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function parsePoint(pt) {
  var p = pt.split('|');
  return { id: p[0], city: p[2] || '', name: p[3] || p[0] };
}

function fetchSuggestions(q) {
  api('findstop', { query: q }).then(function(data) {
    if (!data.Points || !data.Points.length) {
      document.getElementById('sug').innerHTML = '';
      return;
    }
    showSug(data.Points.map(parsePoint).filter(function(p) { return p.id; }));
  }).catch(function() {
    document.getElementById('sug').innerHTML = '';
  });
}

function showSug(stops) {
  var d = document.createElement('div');
  d.className = 'suggestions';
  d.innerHTML = stops.map(function(s) {
    return '<div class="sug-item" data-id="' + esc(s.id) + '" data-name="' + esc(s.name) + '" data-city="' + esc(s.city) + '">'
      + '<span style="font-weight:600">' + esc(s.name) + '</span>'
      + (s.city ? '<span class="sug-city">' + esc(s.city) + '</span>' : '')
      + '</div>';
  }).join('');
  d.querySelectorAll('.sug-item').forEach(function(el) {
    el.onclick = function() { pick({ id: el.dataset.id, name: el.dataset.name, city: el.dataset.city }); };
  });
  var se = document.getElementById('sug');
  se.innerHTML = '';
  se.appendChild(d);
}

function pick(s) {
  stopId = s.id;
  stopName = s.city ? s.name + ', ' + s.city : s.name;
  inp.value = s.name;
  clearBtn.classList.add('visible');
  document.getElementById('sug').innerHTML = '';
  activeF = 'all';
  loadDeps();
}

function msDate(s) {
  if (!s) return null;
  var i = s.indexOf('(');
  var j = s.indexOf('+', i);
  if (j < 0) j = s.indexOf(')', i);
  if (i < 0) return null;
  return new Date(parseInt(s.substring(i + 1, j)));
}

function fmt(d) {
  if (!d) return '--:--';
  return new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function mclass(mot) {
  if (!mot) return 'bus';
  var m = mot.toLowerCase();
  if (m.indexOf('tram') >= 0) return 'tram';
  if (m.indexOf('suburban') >= 0) return 'sbahn';
  if (m.indexOf('ferry') >= 0) return 'ferry';
  return 'bus';
}

function micon(mot) {
  if (!mot) return '🚌';
  var m = mot.toLowerCase();
  if (m.indexOf('tram') >= 0) return '🚊';
  if (m.indexOf('suburban') >= 0) return '🚆';
  if (m.indexOf('ferry') >= 0) return '⛴';
  return '🚌';
}

function loadDeps() {
  if (!stopId) return;
  if (timer) clearTimeout(timer);
  document.getElementById('hdr').style.display = 'none';
  document.getElementById('filters').style.display = 'none';
  setS('<div class="icon">🚊</div>Lade Abfahrten…');
  api('departures', { stopid: stopId, time: new Date().toISOString(), limit: 40 }).then(function(data) {
    if (!data.Departures) { setS('<div class="icon">😶</div>Keine Abfahrten'); return; }
    allDeps = data.Departures;
    document.getElementById('stop-lbl').textContent = data.Name || stopName;
    document.getElementById('upd-lbl').textContent='Aktualisiert um '+fmt(new Date());
    document.getElementById('hdr').style.display = 'flex';
    buildFilters();
    renderDeps();
    timer = setTimeout(loadDeps, 30000);
  }).catch(function(e) {
    setS('<div class="icon">⚠️</div>Fehler: ' + e.message);
  });
}

function buildFilters() {
  var modes = [];
  allDeps.forEach(function(d) {
    var m = d.Mot || 'CityBus';
    if (modes.indexOf(m) < 0) modes.push(m);
  });
  var fe = document.getElementById('filters');
  if (modes.length <= 1) { fe.style.display = 'none'; return; }
  var labels = { Tram: '🚊 Tram', CityBus: '🚌 Bus', IntercityBus: '🚌 PlusBus', SuburbanRailway: '🚆 S-Bahn', Ferry: '⛴ Fähre' };
  var btns = [{ k: 'all', l: 'Alle' }].concat(modes.map(function(m) { return { k: m, l: labels[m] || m }; }));
  fe.style.display = 'flex';
  fe.innerHTML = btns.map(function(b) {
    return '<button class="fbtn' + (activeF === b.k ? ' on' : '') + '" onclick="setF(\'' + b.k + '\')">' + b.l + '</button>';
  }).join('');
}

function setF(f) { activeF = f; buildFilters(); renderDeps(); }

function renderDeps() {
  var deps = activeF === 'all' ? allDeps : allDeps.filter(function(d) { return (d.Mot || 'CityBus') === activeF; });
  if (!deps.length) { setS('Keine Abfahrten für diesen Filter'); return; }
  document.getElementById('list').innerHTML = deps.slice(0, 25).map(function(dep) {
    var isCancelled = dep.State === 'Cancelled' || (dep.CancelReasons && dep.CancelReasons.length > 0);
    var sched = msDate(dep.ScheduledTime), real = msDate(dep.RealTime);
    var displayTime = real || sched;
    var dm = (sched && real) ? Math.round((real - sched) / 60000) : null;
    var minsUntil = displayTime ? Math.round((displayTime - new Date()) / 60000) : null;
    var pf = (dep.Platform && dep.Platform.Name) ? '<span class="pf">Steig ' + esc(dep.Platform.Name) + '</span>' : '';

    if (isCancelled) {
      return '<div class="dep-row cancelled">'
        + '<div class="badge ' + mclass(dep.Mot) + '">' + micon(dep.Mot) + ' ' + esc(dep.LineName || '?') + '</div>'
        + '<div class="dir">' + esc(dep.Direction || '—') + '</div>'
        + pf
        + '<div class="tblock"><div class="tcancelled">Fällt aus</div><div class="trow2"><span class="ttime strike">' + fmt(displayTime) + '</span></div></div>'
        + '</div>';
    }

    var untilHtml;
    if (minsUntil === null) untilHtml = '<div class="tuntil">--</div>';
    else if (minsUntil <= 0) untilHtml = '<div class="tnow">Jetzt</div>';
    else untilHtml = '<div class="tuntil">in ' + minsUntil + ' min</div>';
    var delayHtml = '';
    if (dm !== null && dm > 0) delayHtml = '<span class="tlate">+' + dm + '</span>';
    return '<div class="dep-row">'
      + '<div class="badge ' + mclass(dep.Mot) + '">' + micon(dep.Mot) + ' ' + esc(dep.LineName || '?') + '</div>'
      + '<div class="dir">' + esc(dep.Direction || '—') + '</div>'
      + pf
      + '<div class="tblock">' + untilHtml + '<div class="trow2"><span class="ttime">' + fmt(displayTime) + '</span>' + delayHtml + '</div></div>'
      + '</div>';
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

inp.focus();
</script>
</body>
</html>
