<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DVB Abfahrten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">

  <div class="app-header">
    <div class="app-icon">🚊</div>
    <span class="app-title">DVB Abfahrtsmonitor</span>
  </div>

  <div class="tabs">
    <button class="tab on" data-view="deps" onclick="switchView('deps')">Abfahrten</button>
    <button class="tab" data-view="trip" onclick="switchView('trip')">Verbindung</button>
  </div>

  <div id="view-deps">
  <div class="search-wrap">
    <span class="search-icon">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="text" id="inp" placeholder="Haltestelle suchen…" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="search-clear" id="clear-btn" onclick="clearSearch()">×</button>
  </div>

  <div id="sug"></div>
  <div id="filters" class="filters" style="display:none"></div>

  <div id="hdr" class="dep-header" style="display:none">
    <div>
      <div class="dep-title" id="stop-lbl"></div>
      <div class="dep-sub" id="upd-lbl"></div>
    </div>
    <button class="reload-btn" onclick="loadDeps()">↻ Aktualisieren</button>
  </div>

  <div id="list" class="dep-list">
    <div class="status"><div class="icon">🚉</div>Haltestelle eingeben</div>
  </div>
  </div>

  <div id="view-trip" style="display:none">
    <div class="trip-fields">
      <div class="trip-inputs">
        <div class="search-wrap trip-field">
          <span class="field-label">Von</span>
          <input type="text" id="from-inp" placeholder="Start…" autocomplete="off" autocorrect="off" spellcheck="false"/>
        </div>
        <div id="from-sug"></div>
        <div class="search-wrap trip-field">
          <span class="field-label">Nach</span>
          <input type="text" id="to-inp" placeholder="Ziel…" autocomplete="off" autocorrect="off" spellcheck="false"/>
        </div>
        <div id="to-sug"></div>
      </div>
      <button class="swap-btn" onclick="swapTrip()" aria-label="Start und Ziel tauschen">⇅</button>
    </div>
    <div id="trip-list" class="dep-list">
      <div class="status"><div class="icon">🧭</div>Start und Ziel eingeben</div>
    </div>
  </div>

</div>
<script>
var stopId = null, stopName = '', allDeps = [], activeF = 'all', timer = null, debounce = null;
var inp = document.getElementById('inp');
var clearBtn = document.getElementById('clear-btn');

inp.addEventListener('input', function() {
  var q = inp.value.trim();
  clearBtn.classList.toggle('visible', q.length > 0);
  if (!q) { document.getElementById('sug').innerHTML = ''; return; }
  clearTimeout(debounce);
  debounce = setTimeout(function() { fetchSuggestions(q); }, 280);
});

inp.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') clearSearch();
});

function clearSearch() {
  inp.value = '';
  clearBtn.classList.remove('visible');
  document.getElementById('sug').innerHTML = '';
  inp.focus();
}

function setS(h) {
  document.getElementById('list').innerHTML = '<div class="status">' + h + '</div>';
}

function api(path, body) {
  return fetch('/api/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function parsePoint(pt) {
  var p = pt.split('|');
  return { id: p[0], city: p[2] || '', name: p[3] || p[0] };
}

function fetchSuggestions(q) {
  api('findstop', { query: q }).then(function(data) {
    if (!data.Points || !data.Points.length) {
      document.getElementById('sug').innerHTML = '';
      return;
    }
    showSug(data.Points.map(parsePoint).filter(function(p) { return p.id; }));
  }).catch(function() {
    document.getElementById('sug').innerHTML = '';
  });
}

function showSug(stops) {
  var d = document.createElement('div');
  d.className = 'suggestions';
  d.innerHTML = stops.map(function(s) {
    return '<div class="sug-item" data-id="' + esc(s.id) + '" data-name="' + esc(s.name) + '" data-city="' + esc(s.city) + '">'
      + '<span style="font-weight:600">' + esc(s.name) + '</span>'
      + (s.city ? '<span class="sug-city">' + esc(s.city) + '</span>' : '')
      + '</div>';
  }).join('');
  d.querySelectorAll('.sug-item').forEach(function(el) {
    el.onclick = function() { pick({ id: el.dataset.id, name: el.dataset.name, city: el.dataset.city }); };
  });
  var se = document.getElementById('sug');
  se.innerHTML = '';
  se.appendChild(d);
}

function pick(s) {
  stopId = s.id;
  stopName = s.city ? s.name + ', ' + s.city : s.name;
  inp.value = s.name;
  clearBtn.classList.add('visible');
  document.getElementById('sug').innerHTML = '';
  activeF = 'all';
  loadDeps();
}

function msDate(s) {
  if (!s) return null;
  var i = s.indexOf('(');
  var j = s.indexOf('+', i);
  if (j < 0) j = s.indexOf(')', i);
  if (i < 0) return null;
  return new Date(parseInt(s.substring(i + 1, j)));
}

function fmt(d) {
  if (!d) return '--:--';
  return new Date(d).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function mclass(mot) {
  if (!mot) return 'bus';
  var m = mot.toLowerCase();
  if (m.indexOf('tram') >= 0) return 'tram';
  if (m.indexOf('suburban') >= 0) return 'sbahn';
  if (m.indexOf('ferry') >= 0) return 'ferry';
  return 'bus';
}

function micon(mot) {
  if (!mot) return '🚌';
  var m = mot.toLowerCase();
  if (m.indexOf('tram') >= 0) return '🚊';
  if (m.indexOf('suburban') >= 0) return '🚆';
  if (m.indexOf('ferry') >= 0) return '⛴';
  return '🚌';
}

function loadDeps() {
  if (!stopId) return;
  if (timer) clearTimeout(timer);
  document.getElementById('hdr').style.display = 'none';
  document.getElementById('filters').style.display = 'none';
  setS('<div class="icon">🚊</div>Lade Abfahrten…');
  api('departures', { stopid: stopId, time: new Date().toISOString(), limit: 40 }).then(function(data) {
    if (!data.Departures) { setS('<div class="icon">😶</div>Keine Abfahrten'); return; }
    allDeps = data.Departures;
    document.getElementById('stop-lbl').textContent = data.Name || stopName;
    document.getElementById('upd-lbl').textContent='Aktualisiert um '+fmt(new Date());
    document.getElementById('hdr').style.display = 'flex';
    buildFilters();
    renderDeps();
    timer = setTimeout(loadDeps, 30000);
  }).catch(function(e) {
    setS('<div class="icon">⚠️</div>Fehler: ' + e.message);
  });
}

function buildFilters() {
  var modes = [];
  allDeps.forEach(function(d) {
    var m = d.Mot || 'CityBus';
    if (modes.indexOf(m) < 0) modes.push(m);
  });
  var fe = document.getElementById('filters');
  if (modes.length <= 1) { fe.style.display = 'none'; return; }
  var labels = { Tram: '🚊 Tram', CityBus: '🚌 Bus', IntercityBus: '🚌 PlusBus', SuburbanRailway: '🚆 S-Bahn', Ferry: '⛴ Fähre' };
  var btns = [{ k: 'all', l: 'Alle' }].concat(modes.map(function(m) { return { k: m, l: labels[m] || m }; }));
  fe.style.display = 'flex';
  fe.innerHTML = btns.map(function(b) {
    return '<button class="fbtn' + (activeF === b.k ? ' on' : '') + '" onclick="setF(\'' + b.k + '\')">' + b.l + '</button>';
  }).join('');
}

function setF(f) { activeF = f; buildFilters(); renderDeps(); }

function renderDeps() {
  var deps = activeF === 'all' ? allDeps : allDeps.filter(function(d) { return (d.Mot || 'CityBus') === activeF; });
  if (!deps.length) { setS('Keine Abfahrten für diesen Filter'); return; }
  document.getElementById('list').innerHTML = deps.slice(0, 25).map(function(dep) {
    var isCancelled = dep.State === 'Cancelled' || (dep.CancelReasons && dep.CancelReasons.length > 0);
    var sched = msDate(dep.ScheduledTime), real = msDate(dep.RealTime);
    var displayTime = real || sched;
    var dm = (sched && real) ? Math.round((real - sched) / 60000) : null;
    var minsUntil = displayTime ? Math.round((displayTime - new Date()) / 60000) : null;
    var pf = (dep.Platform && dep.Platform.Name) ? '<span class="pf">Steig ' + esc(dep.Platform.Name) + '</span>' : '';

    if (isCancelled) {
      return '<div class="dep-row cancelled">'
        + '<div class="badge ' + mclass(dep.Mot) + '">' + micon(dep.Mot) + ' ' + esc(dep.LineName || '?') + '</div>'
        + '<div class="dir">' + esc(dep.Direction || '—') + '</div>'
        + pf
        + '<div class="tblock"><div class="tcancelled">Fällt aus</div><div class="trow2"><span class="ttime strike">' + fmt(displayTime) + '</span></div></div>'
        + '</div>';
    }

    var untilHtml;
    if (minsUntil === null) untilHtml = '<div class="tuntil">--</div>';
    else if (minsUntil <= 0) untilHtml = '<div class="tnow">Jetzt</div>';
    else untilHtml = '<div class="tuntil">in ' + minsUntil + ' min</div>';
    var delayHtml = '';
    if (dm !== null && dm > 0) delayHtml = '<span class="tlate">+' + dm + '</span>';
    return '<div class="dep-row">'
      + '<div class="badge ' + mclass(dep.Mot) + '">' + micon(dep.Mot) + ' ' + esc(dep.LineName || '?') + '</div>'
      + '<div class="dir">' + esc(dep.Direction || '—') + '</div>'
      + pf
      + '<div class="tblock">' + untilHtml + '<div class="trow2"><span class="ttime">' + fmt(displayTime) + '</span>' + delayHtml + '</div></div>'
      + '</div>';
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

inp.focus();
</script>
<script src="/trip.js"></script>
</body>
</html>
